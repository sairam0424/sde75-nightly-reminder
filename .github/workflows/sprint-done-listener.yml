# 15-day interview sprint: two-way "done" listener on the second bot.
# Independent of the SDE-75 listener; see docs/SPRINT_TRACK.md.
name: Sprint Done Listener

on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *' # offset 5 min from the SDE-75 listener so their state commits never race
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sprint-done-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the sprint bot for a "done" reply and update Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SPRINT_DATA_SOURCE_ID: ${{ vars.SPRINT_DATA_SOURCE_ID }}
          SPRINT_TELEGRAM_BOT_TOKEN: ${{ secrets.SPRINT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/sprint_mark_done.py
      - name: Commit updated offset state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- state/sprint_telegram_offset.json)" ]; then
            git add state/sprint_telegram_offset.json
            git commit -m "Update sprint Telegram offset state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No offset change, nothing to commit."
          fi
