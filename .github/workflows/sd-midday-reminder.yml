# 15-day system design concepts: midday reminder (fourth bot, own Notion DB).
# Independent of the SDE-75 and sprint reminders; see docs/SD_TRACK.md.
name: System Design Reminder

on:
  schedule:
    - cron: '33 8 * * *' # 08:33 UTC == 14:03 IST, off-peak minute
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch today's concepts and notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SD_DATA_SOURCE_ID: ${{ vars.SD_DATA_SOURCE_ID }}
          SD_TELEGRAM_BOT_TOKEN: ${{ secrets.SD_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/sd_reminder.py
      - name: Notify on failure
        if: failure()
        env:
          SD_TELEGRAM_BOT_TOKEN: ${{ secrets.SD_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${SD_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=System design reminder workflow FAILED - check GitHub Actions logs."