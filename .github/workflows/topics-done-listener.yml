# 15-day topics track: two-way "done" listener on the third bot.
# Independent of the other listeners; see docs/TOPICS_TRACK.md.
name: Topics Done Listener

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *' # distinct minutes from the SDE-75 (:00s) and sprint (:05s) listeners
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: topics-done-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the topics bot for a "done" reply and update Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TOPICS_DATA_SOURCE_ID: ${{ vars.TOPICS_DATA_SOURCE_ID }}
          TOPICS_TELEGRAM_BOT_TOKEN: ${{ secrets.TOPICS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/topics_mark_done.py
      - name: Commit updated offset state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- state/topics_telegram_offset.json)" ]; then
            git add state/topics_telegram_offset.json
            git commit -m "Update topics Telegram offset state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No offset change, nothing to commit."
          fi
