# 15-day interview sprint: nightly reminder (second bot, separate Notion DB).
# Independent of the SDE-75 reminder; see docs/SPRINT_TRACK.md.
name: Sprint Nightly Reminder

on:
  schedule:
    - cron: '38 14 * * *' # 14:38 UTC == 20:08 IST - off-peak minute, 15 min after the SDE-75 reminder so the two never queue together
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch today's problems and notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SPRINT_DATA_SOURCE_ID: ${{ vars.SPRINT_DATA_SOURCE_ID }}
          SPRINT_TELEGRAM_BOT_TOKEN: ${{ secrets.SPRINT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/sprint_reminder.py
      - name: Notify on failure
        if: failure()
        env:
          SPRINT_TELEGRAM_BOT_TOKEN: ${{ secrets.SPRINT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${SPRINT_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=Sprint reminder workflow FAILED - check GitHub Actions logs."