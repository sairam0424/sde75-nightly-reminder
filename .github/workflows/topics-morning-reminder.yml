# 15-day GenAI + Resume + Stories topics: morning reminder (third bot, own Notion DB).
# Independent of the SDE-75 and sprint reminders; see docs/TOPICS_TRACK.md.
name: Topics Morning Reminder

on:
  schedule:
    - cron: '33 3 * * *' # 03:33 UTC == 09:03 IST, off-peak minute
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch today's topics and notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TOPICS_DATA_SOURCE_ID: ${{ vars.TOPICS_DATA_SOURCE_ID }}
          TOPICS_TELEGRAM_BOT_TOKEN: ${{ secrets.TOPICS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/topics_reminder.py
      - name: Notify on failure
        if: failure()
        env:
          TOPICS_TELEGRAM_BOT_TOKEN: ${{ secrets.TOPICS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOPICS_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=Topics reminder workflow FAILED - check GitHub Actions logs."